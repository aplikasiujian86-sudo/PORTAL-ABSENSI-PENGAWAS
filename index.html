<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b63">
<title>Portal Absensi Pengawas</title>

<style>
:root {
  font-family: Arial, sans-serif;
  color: #172b4d;
  background: #f2f5f9;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 14px; }
.wrap { max-width: 760px; margin: auto; }
.card {
  background: white;
  padding: 18px;
  margin-bottom: 14px;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 3px 14px #00000008;
}
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 0 0 12px; }
p { line-height: 1.5; }
.muted { color: #667085; font-size: 13px; line-height: 1.5; }
label { display: block; font-weight: bold; margin: 12px 0 6px; }
select, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  font-size: 15px;
}
select {
  border: 1px solid #cbd5e1;
  background: white;
}
button {
  border: 0;
  background: #155eef;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .5; }
.secondary { background: #e9eef5; color: #344054; }
.danger { background: #d92d20; }
.success { background: #ecfdf3; color: #027a48; }
.notice {
  padding: 12px;
  border-radius: 9px;
  background: #fff7e6;
  color: #8a4b08;
  margin: 10px 0;
  font-size: 14px;
}
.notice.error { background: #fff0f0; color: #b42318; }
.notice.success { background: #ecfdf3; color: #027a48; }
.schedule {
  border: 1px solid #dce3ec;
  border-radius: 11px;
  padding: 14px;
  margin: 10px 0;
}
.schedule h3 { margin: 0 0 7px; font-size: 17px; }
.schedule p { margin: 5px 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; margin-top: 12px; }
.toolbar button { flex: 1; }
#scanPanel { display: none; }
#scanner {
  width: 100%;
  background: #101828;
  border-radius: 12px;
  max-height: 55vh;
}
.student {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eaecf0;
}
.student-name { font-size: 14px; font-weight: bold; }
.student select { width: 135px; padding: 9px; }
.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #e8f2ff;
  color: #175cd3;
  font-size: 12px;
}
.hidden { display: none !important; }
@media(max-width:480px) {
  body { padding: 8px; }
  .card { padding: 14px; }
}
</style>
</head>

<body>
<div class="wrap">

  <section class="card">
    <h1>Portal Absensi Pengawas</h1>
    <div class="muted" id="subtitle">Memuat portal...</div>
    <div id="message"></div>
  </section>

  <main id="app">
    <section class="card">Memuat data...</section>
  </main>

</div>

<script>
const API = '/.netlify/functions/api';

let teachers = [];
let selectedTeacher = '';
let selectedSchedule = null;
let portalInfo = null;
let qrValue = '';
let cameraStream = null;
let scanFrame = 0;
let scanBusy = false;

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function message(text, type = '') {
  $('message').innerHTML = text
    ? `<div class="notice ${type}">${esc(text)}</div>`
    : '';
}

async function callServer(action, extra = {}) {
  const response = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...extra })
  });

  let data;

  try {
    data = await response.json();
  } catch (e) {
    throw new Error('Respons server tidak dapat dibaca.');
  }

  if (!response.ok || !data || data.ok !== true) {
    throw new Error(data && data.error
      ? data.error
      : 'Permintaan ke server gagal.');
  }

  return data;
}

// LANGKAH AWAL: AMBIL DAFTAR GURU
async function init() {
  try {
    const data = await callServer('portal_teachers');
    teachers = data.teachers || [];

    $('subtitle').textContent =
      'Silakan pilih nama guru untuk melihat jadwal pengawasan.';

    renderTeacher();
  } catch (e) {
    message(e.message, 'error');
    $('app').innerHTML = '';
  }
}

// TAMPILKAN PILIHAN GURU
function renderTeacher() {
  stopScanner();

  $('app').innerHTML = `
    <section class="card">
      <h2>1. Pilih Nama Guru</h2>
      <p class="muted">
        Pilih nama sesuai data guru yang terdaftar.
      </p>

      <label>Nama Guru</label>
      <select id="teacherSelect" onchange="selectTeacher(this.value)">
        <option value="">-- Pilih Nama Guru --</option>
        ${teachers.map(t => `
          <option value="${esc(t.id)}">
            ${esc(t.nama)}
          </option>
        `).join('')}
      </select>
    </section>

    <section class="card" id="schedulePanel">
      <h2>2. Pilih Jadwal Pengawasan</h2>
      <div class="muted">
        Jadwal guru akan ditampilkan setelah nama dipilih.
      </div>
      <div id="scheduleList"></div>
    </section>

    <section class="card" id="scanPanel">
      <h2>3. Scan QR Kelas</h2>
      <p class="muted" id="scanText">
        Arahkan kamera ke QR kelas yang telah disiapkan Admin.
      </p>
      <video id="scanner" playsinline muted></video>
      <div class="toolbar">
        <button class="secondary" onclick="cancelScan()">Batal</button>
      </div>
    </section>
  `;

  message('');
}

// AMBIL JADWAL GURU
async function selectTeacher(id) {
  selectedTeacher = String(id || '');
  selectedSchedule = null;
  portalInfo = null;
  qrValue = '';

  stopScanner();

  if (!selectedTeacher) {
    $('scheduleList').innerHTML = '';
    return;
  }

  $('scheduleList').innerHTML =
    '<p class="muted">Mengambil jadwal guru...</p>';

  try {
    const data = await callServer('portal_teacher_classes', {
      teacherId: selectedTeacher
    });

    const schedules = data.schedules || [];

    if (!schedules.length) {
      $('scheduleList').innerHTML =
        '<div class="notice">Tidak ada jadwal pengawasan untuk guru ini hari ini.</div>';
      return;
    }

    $('scheduleList').innerHTML = schedules.map((s, i) => `
      <div class="schedule">
        <h3>${esc(s.kelas || 'Kelas')} ${esc(s.jenjang || '')}</h3>
        <p><b>Waktu:</b> ${esc(s.time || '-')}</p>
        <p><b>Mata pelajaran:</b> ${esc(s.mapel || '-')}</p>
        <p><b>Jenis:</b> ${esc(s.type || '-')}</p>
        ${s.locked
          ? '<span class="badge">Sudah selesai</span>'
          : `<button onclick="chooseSchedule(${i})">Pilih Jadwal dan Scan QR</button>`
        }
      </div>
    `).join('');

    window.currentSchedules = schedules;

  } catch (e) {
    $('scheduleList').innerHTML = '';
    message(e.message, 'error');
  }
}

// PILIH SATU JADWAL
function chooseSchedule(index) {
  const schedules = window.currentSchedules || [];
  selectedSchedule = schedules[index];

  if (!selectedSchedule) {
    message('Jadwal tidak ditemukan.', 'error');
    return;
  }

  $('scanPanel').style.display = 'block';
  $('scanText').textContent =
    'Scan QR kelas ' + selectedSchedule.kelas +
    '. Pastikan QR sesuai dengan kelas yang dipilih.';

  $('scanPanel').scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });

  startScanner();
}

// MULAI KAMERA
async function startScanner() {
  stopScanner();

  if (!('BarcodeDetector' in window)) {
    message(
      'Pemindai QR belum didukung browser ini. Gunakan Google Chrome terbaru.',
      'error'
    );
    return;
  }

  try {
    const video = $('scanner');
    const detector = new BarcodeDetector({
      formats: ['qr_code']
    });

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' } }
    });

    video.srcObject = cameraStream;
    await video.play();

    scanBusy = false;
    const thisFrame = ++scanFrame;

    async function scan() {
      if (thisFrame !== scanFrame || !cameraStream || scanBusy) return;

      try {
        const codes = await detector.detect(video);

        if (codes.length && codes[0].rawValue) {
          scanBusy = true;
          await verifyQR(codes[0].rawValue);
          return;
        }
      } catch (e) {}

      if (thisFrame === scanFrame) {
        requestAnimationFrame(scan);
      }
    }

    requestAnimationFrame(scan);
    message('Kamera aktif. Silakan arahkan ke QR kelas.');

  } catch (e) {
    stopScanner();
    message(
      'Kamera tidak dapat dibuka. Izinkan akses kamera pada browser.',
      'error'
    );
  }
}

function qrToken(value) {
  const raw = String(value || '').trim();

  try {
    const url = new URL(raw);
    return url.searchParams.get('qr') ||
           url.searchParams.get('token') ||
           raw;
  } catch (e) {
    return raw;
  }
}

// PERIKSA QR KE SERVER
async function verifyQR(value) {
  stopScanner();
  message('QR terbaca. Memeriksa kecocokan kelas...');

  try {
    qrValue = qrToken(value);

    const data = await callServer('portal_info', {
      qrKey: qrValue,
      teacherId: selectedTeacher,
      assignmentId: selectedSchedule.id
    });

    portalInfo = data;
    renderAttendance();

  } catch (e) {
    message(e.message, 'error');

    $('scanPanel').style.display = 'block';
    startScanner();
  }
}

// TAMPILKAN PILIHAN MENGAWAS / MENGGANTIKAN
function renderAttendance() {
  const students = portalInfo.students || [];
  const otherTeachers = (portalInfo.teachers || [])
    .filter(t => String(t.id) !== selectedTeacher);

  $('app').innerHTML = `
    <section class="card">
      <h2>4. Konfirmasi Pengawasan</h2>

      <div class="notice success">
        QR kelas berhasil diverifikasi.
      </div>

      <p><b>Guru:</b> ${esc(
        teachers.find(t => String(t.id) === selectedTeacher)?.nama || ''
      )}</p>

      <p><b>Kelas:</b> ${esc(portalInfo.kelas.nama || '')}</p>
      <p><b>Jadwal:</b> ${esc(portalInfo.slot.mapel || '')}</p>
      <p><b>Waktu:</b> ${esc(portalInfo.slot.time || '')}</p>

      <label>Jenis Pengawasan</label>
      <select id="mode" onchange="changeMode()">
        <option value="">-- Pilih --</option>
        <option value="MENGAWAS">Mengawas</option>
        <option value="MENGGANTIKAN">Menggantikan</option>
      </select>

      <div id="replacementBox" class="hidden">
        <label>Guru yang Digantikan</label>
        <select id="replacementTeacher">
          <option value="">-- Pilih Guru --</option>
          ${otherTeachers.map(t => `
            <option value="${esc(t.id)}">${esc(t.nama)}</option>
          `).join('')}
        </select>
      </div>
    </section>

    <section class="card">
      <h2>5. Absensi Siswa</h2>
      <p class="muted">
        Periksa kehadiran setiap siswa. Semua siswa wajib memiliki status.
      </p>

      <div id="studentList">
        ${students.length ? students.map((s, i) => `
          <div class="student">
            <div>
              <div class="student-name">${i + 1}. ${esc(s.nama)}</div>
              <div class="muted">${esc(s.nis || s.nomorUjian || '')}</div>
            </div>
            <select data-student="${esc(s.id)}">
              <option value="HADIR">Hadir</option>
              <option value="TIDAK HADIR">Tidak Hadir</option>
            </select>
          </div>
        `).join('') : '<div class="notice">Tidak ada data siswa pada kelas ini.</div>'}
      </div>

      <div class="toolbar">
        <button onclick="submitAttendance()">Kirim Absensi</button>
      </div>
    </section>
  `;

  message('');
}

function changeMode() {
  const mode = $('mode').value;
  $('replacementBox').classList.toggle(
    'hidden',
    mode !== 'MENGGANTIKAN'
  );
}

// KIRIM ABSENSI KE GOOGLE APPS SCRIPT
async function submitAttendance() {
  const mode = $('mode').value;

  if (!mode) {
    message('Pilih Mengawas atau Menggantikan.', 'error');
    return;
  }

  let replacementTeacherId = '';

  if (mode === 'MENGGANTIKAN') {
    replacementTeacherId = $('replacementTeacher').value;

    if (!replacementTeacherId) {
      message('Pilih guru yang digantikan.', 'error');
      return;
    }
  }

  const marks = [...document.querySelectorAll('[data-student]')].map(el => ({
    studentId: el.dataset.student,
    status: el.value
  }));

  if (marks.length !== (portalInfo.students || []).length) {
    message('Daftar kehadiran siswa belum lengkap.', 'error');
    return;
  }

  const buttons = document.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  message('Menyimpan absensi...');

  try {
    const result = await callServer('portal_submit', {
      payload: {
        date: portalInfo.today,
        teacherId: selectedTeacher,
        assignmentId: selectedSchedule.id,
        qrKey: qrValue,
        mode,
        replacementTeacherId,
        students: marks
      }
    });

    $('app').innerHTML = `
      <section class="card">
        <h2>Absensi Berhasil Disimpan</h2>

        <div class="notice success">
          ${esc(result.message || 'Absensi berhasil disimpan.')}
        </div>

        <p>Nama guru: <b>${esc(
          teachers.find(t => String(t.id) === selectedTeacher)?.nama || ''
        )}</b></p>

        <p>Kelas: <b>${esc(portalInfo.kelas.nama || '')}</b></p>
        <p>Mata pelajaran: <b>${esc(portalInfo.slot.mapel || '')}</b></p>
        <p>Jumlah siswa: <b>${marks.length}</b></p>

        <button onclick="location.reload()">Kembali ke Awal</button>
      </section>
    `;

    message('');

  } catch (e) {
    buttons.forEach(b => b.disabled = false);
    message(e.message, 'error');
  }
}

function cancelScan() {
  stopScanner();
  $('scanPanel').style.display = 'none';
  message('');
}

function stopScanner() {
  scanFrame++;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  const video = $('scanner');
  if (video) video.srcObject = null;

  scanBusy = false;
}

window.addEventListener('pagehide', stopScanner);

init();
</script>
</body>
</html>
